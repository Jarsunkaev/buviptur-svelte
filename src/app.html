<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <link rel="icon" type="image/png" href="/logo.PNG" />
        <link rel="shortcut icon" type="image/png" href="/logo.PNG" />
        <link rel="apple-touch-icon" href="/logo.PNG" />
        <!-- CRITICAL: Refined viewport meta tag for mobile browsers -->
        <!-- interactive-widget=resizes-content might cause issues, removed for standard fit -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" /> 
        <!-- Include Tailwind CSS via CDN - for development, consider local build for production -->
        <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
        <!-- Custom styles -->
        <style>
            :root {
                --teal-900: #113946;
                --teal-800: #1a5f7a;
                --teal-700: #228291;
                --teal-600: #2aa1b7;
                --accent: #dfb964;
                
                /* Dynamic viewport units for mobile - modern browsers handle this */
                /* Removed custom --vh, --dvh variables as CSS supports dvh/svh/lvh natively */
            }

            html {
                scroll-behavior: smooth;
                scroll-padding-top: 8rem; /* Keep if needed for sticky headers/anchors */
                -webkit-text-size-adjust: 100%;
                -webkit-tap-highlight-color: transparent;
                /* Prevent bounce scrolling on iOS - keep if desired, but can feel "weird" */
                overscroll-behavior: none; 
                /* Fix for mobile viewport issues - rely on dvh/svh/lvh */
                height: 100%; /* Fallback for older browsers */
                height: 100dvh; /* Dynamic viewport height, handles mobile UI changes */
            }

            body {
                overflow-x: hidden; /* Prevent horizontal scrollbar */
                width: 100%;
                position: relative;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
                text-rendering: optimizeLegibility;
                /* Fix for mobile viewport */
                min-height: 100vh; /* Fallback */
                min-height: 100dvh; /* Dynamic viewport height */
                /* Prevent bounce scrolling */
                overscroll-behavior: none; /* Keep if desired */
                -webkit-overflow-scrolling: touch; /* For smoother scrolling on iOS Safari */
            }

            /* Prevent content shift when scrollbar appears */
            /* This is a good practice, keep it */
            html {
                overflow-y: scroll;
            }

            /* Hide scrollbar for Chrome, Safari and Opera (custom styling) */
            ::-webkit-scrollbar {
                width: 8px;
            }

            ::-webkit-scrollbar-track {
                background: #f1f1f1;
            }

            ::-webkit-scrollbar-thumb {
                background: var(--teal-700);
                border-radius: 4px;
            }

            ::-webkit-scrollbar-thumb:hover {
                background: var(--teal-800);
            }

            @keyframes pulse {
                0%, 100% { transform: scale(1); }
                50% { transform: scale(1.02); }
            }
            
            .animate-pulse-slow {
                animation: pulse 10s ease-in-out infinite;
            }
            
            @keyframes fadeInUp {
                from {
                    opacity: 0;
                    transform: translateY(20px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
            
            .animate-fadeInUp {
                animation: fadeInUp 0.6s ease-out forwards;
            }
            
            /* CRITICAL: Mobile optimizations for viewport issues - simplified */
            @media (max-width: 640px) {
                html {
                    font-size: 15px;
                    /* Use dvh for dynamic height, as 100vh can be problematic with mobile UI */
                    height: 100dvh; 
                }
                
                body {
                    min-height: 100dvh; 
                    position: relative;
                    overflow-x: hidden;
                }
                
                /* Fix viewport height issues */
                .min-h-screen {
                    min-height: 100dvh !important;
                }
                
                /* Improve tap targets for mobile */
                button, a {
                    min-height: 44px;
                    min-width: 44px;
                }
                
                /* Prevent zoom on inputs */
                input, select, textarea {
                    font-size: 16px !important; /* Prevents iOS auto-zoom on focus */
                }
            }
            
            /* CRITICAL: Ensure dvh is used where supported */
            @supports (height: 100dvh) {
                .min-h-screen {
                    min-height: 100dvh;
                }
                
                html, body {
                    height: 100dvh;
                }
            }
            
            /* Better input handling on iOS */
            input, 
            textarea, 
            button, 
            select, 
            a {
                -webkit-tap-highlight-color: transparent;
            }
            
            /* Fix for iOS momentum scrolling */
            .overflow-y-scroll {
                -webkit-overflow-scrolling: touch;
            }
            
            /* CRITICAL: Prevent layout shifts from mobile browser UI */
            .site-wrapper { /* Ensure this class is on your main layout wrapper if used */
                position: relative;
                min-height: 100dvh; /* Use dvh here */
                display: flex;
                flex-direction: column;
            }
            
            /* Prevent menu scroll issues (keep if you have a full-screen menu overlay) */
            html.menu-open,
            body.menu-open {
                overflow: hidden !important;
                position: fixed !important;
                width: 100% !important;
                height: 100% !important; /* Use 100% for fixed overlays */
            }
            
            /* Fix hero section height on mobile */
            @media (max-width: 768px) {
                .hero-section {
                    min-height: 100dvh; /* Use dvh here */
                    height: 100dvh; /* Use dvh here */
                }
            }
        </style>
        %sveltekit.head%
    </head>
    <body data-sveltekit-preload-data="hover" class="bg-white text-gray-900">
        <div style="display: contents">%sveltekit.body%</div>
        
        <!-- CRITICAL CHANGE: Removed extensive custom JS for viewport height.
             Modern CSS dvh should handle this. Removed maximum-scale meta manipulation too. -->
        <!-- If you still face specific iOS zoom issues, consider simpler, targeted CSS or minimal JS for input focus. -->
    </body>
</html>
