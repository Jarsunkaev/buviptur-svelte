<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<!-- CRITICAL: Fixed viewport meta tag for mobile browsers -->
		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, interactive-widget=resizes-content" />
		<!-- Include Tailwind CSS via CDN -->
		<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
		<!-- Custom styles -->
		<style>
			:root {
				--teal-900: #113946;
				--teal-800: #1a5f7a;
				--teal-700: #228291;
				--teal-600: #2aa1b7;
				--accent: #dfb964;
				
				/* Dynamic viewport units for mobile */
				--vh: 1vh;
				--dvh: 1dvh;
				--svh: 1svh;
				--lvh: 1lvh;
			}

			html {
				scroll-behavior: smooth;
				scroll-padding-top: 8rem;
				-webkit-text-size-adjust: 100%;
				-webkit-tap-highlight-color: transparent;
				/* Prevent bounce scrolling on iOS */
				overscroll-behavior: none;
				/* Fix for mobile viewport issues */
				height: 100%;
				height: 100vh;
				height: 100dvh; /* Dynamic viewport height */
			}

			body {
				overflow-x: hidden;
				width: 100%;
				position: relative;
				-webkit-font-smoothing: antialiased;
				-moz-osx-font-smoothing: grayscale;
				text-rendering: optimizeLegibility;
				/* Fix for mobile viewport */
				min-height: 100vh;
				min-height: 100dvh; /* Dynamic viewport height */
				/* Prevent bounce scrolling */
				overscroll-behavior: none;
				-webkit-overflow-scrolling: touch;
			}

			/* Prevent content shift when scrollbar appears */
			html {
				overflow-y: scroll;
			}

			/* Hide scrollbar for Chrome, Safari and Opera */
			::-webkit-scrollbar {
				width: 8px;
			}

			::-webkit-scrollbar-track {
				background: #f1f1f1;
			}

			::-webkit-scrollbar-thumb {
				background: var(--teal-700);
				border-radius: 4px;
			}

			::-webkit-scrollbar-thumb:hover {
				background: var(--teal-800);
			}

			@keyframes pulse {
				0%, 100% { transform: scale(1); }
				50% { transform: scale(1.02); }
			}
			
			.animate-pulse-slow {
				animation: pulse 10s ease-in-out infinite;
			}
			
			@keyframes fadeInUp {
				from {
					opacity: 0;
					transform: translateY(20px);
				}
				to {
					opacity: 1;
					transform: translateY(0);
				}
			}
			
			.animate-fadeInUp {
				animation: fadeInUp 0.6s ease-out forwards;
			}
			
			/* CRITICAL: Mobile optimizations for viewport issues */
			@media (max-width: 640px) {
				html {
					font-size: 15px;
					/* Force constant height to prevent address bar glitches */
					height: 100vh;
					height: 100dvh;
				}
				
				body {
					/* Use dvh instead of vh for better mobile support */
					min-height: 100vh;
					min-height: 100dvh;
					/* Prevent elastic scrolling on iOS */
					position: relative;
					overflow-x: hidden;
				}
				
				/* Fix viewport height issues */
				.min-h-screen {
					min-height: 100vh;
					min-height: 100dvh !important;
				}
				
				/* Improve tap targets for mobile */
				button, a {
					min-height: 44px;
					min-width: 44px;
				}
				
				/* Prevent zoom on inputs */
				input, select, textarea {
					font-size: 16px !important;
				}
			}
			
			/* CRITICAL: Fix for Chrome mobile address bar */
			@supports (height: 100dvh) {
				.min-h-screen {
					min-height: 100dvh;
				}
				
				html, body {
					height: 100dvh;
				}
			}
			
			/* Better input handling on iOS */
			input, 
			textarea, 
			button, 
			select, 
			a {
				-webkit-tap-highlight-color: transparent;
			}
			
			/* Fix for iOS momentum scrolling */
			.overflow-y-scroll {
				-webkit-overflow-scrolling: touch;
			}
			
			/* CRITICAL: Prevent layout shifts from mobile browser UI */
			.site-wrapper {
				position: relative;
				min-height: 100vh;
				min-height: 100dvh;
				display: flex;
				flex-direction: column;
			}
			
			/* Prevent menu scroll issues */
			html.menu-open,
			body.menu-open {
				overflow: hidden !important;
				position: fixed !important;
				width: 100% !important;
				height: 100% !important;
			}
			
			/* Fix hero section height on mobile */
			@media (max-width: 768px) {
				.hero-section {
					min-height: 100vh;
					min-height: 100dvh;
					height: 100vh;
					height: 100dvh;
				}
			}
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-white text-gray-900">
		<div style="display: contents">%sveltekit.body%</div>
		
		<!-- CRITICAL: JavaScript to handle viewport height changes -->
		<script>
			(function() {
				function setViewportHeight() {
					// Set CSS custom property for current viewport height
					const vh = window.innerHeight * 0.01;
					document.documentElement.style.setProperty('--vh', vh + 'px');
					
					// Handle dynamic viewport height for modern browsers
					if (window.visualViewport) {
						const dvh = window.visualViewport.height * 0.01;
						document.documentElement.style.setProperty('--dvh', dvh + 'px');
					}
				}
				
				// Set initial viewport height
				setViewportHeight();
				
				// Throttled resize handler
				let resizeTimer;
				function handleResize() {
					clearTimeout(resizeTimer);
					resizeTimer = setTimeout(setViewportHeight, 100);
				}
				
				// Listen for resize events
				window.addEventListener('resize', handleResize, { passive: true });
				
				// Listen for visual viewport changes (better for mobile)
				if (window.visualViewport) {
					window.visualViewport.addEventListener('resize', handleResize, { passive: true });
				}
				
				// Prevent zoom on input focus for iOS
				const addMaximumScaleToMetaViewport = () => {
					const el = document.querySelector('meta[name=viewport]');
					if (el !== null && !el.content.includes('maximum-scale')) {
						el.content = el.content + ', maximum-scale=1.0';
					}
				};
				
				// Add event listeners for input focus/blur
				const inputs = ['input', 'select', 'textarea'];
				inputs.forEach(input => {
					document.addEventListener(input + 'focus', addMaximumScaleToMetaViewport, false);
					document.addEventListener(input + 'blur', () => {
						const el = document.querySelector('meta[name=viewport]');
						if (el !== null) {
							el.content = el.content.replace(', maximum-scale=1.0', '');
						}
					}, false);
				});
			})();
		</script>
	</body>
</html>
